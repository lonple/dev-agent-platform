server:
  port: 8200

spring:
  application:
    name: dap-server
  elasticsearch:
    uris: ${DAP_ES_URIS:http://127.0.0.1:9200}
    connection-timeout: 5s
    socket-timeout: 30s
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=dap
    username: postgres
    password: root
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-init-sql: SET client_encoding TO 'UTF8'
  flyway:
    enabled: true
    encoding: UTF-8
    schemas: dap
    default-schema: dap
    create-schemas: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

dap:
  data:
    # 与项目同级的 data 目录（相对 dap-server 工作目录）
    root: ../data
  jwt:
    secret: dap-dev-secret-change-me-please-32bytes!!
    expire-hours: 24
  agent:
    base-url: http://127.0.0.1:8202
    internal-token: ${DAP_AGENT_TOKEN:dev-internal-token}
    connect-timeout-ms: 3000
    read-timeout-ms: 300000
  chat:
    history-max-messages: 20
    history-max-chars: 8000
    step-index-env: ${DAP_CHAT_STEP_INDEX_ENV:dev}
    step-detail-max-chars: 20000
  search:
    ripgrep:
      enabled: true
      # 本机解压路径（避免依赖 PATH）
      executable: E:/app/ripgrep-15.2.0-x86_64-pc-windows-msvc/ripgrep-15.2.0-x86_64-pc-windows-msvc/rg.exe
      timeout-ms: 15000
      max-hits: 40
      max-count-per-file: 5

  review:
    data-dir: ${DAP_REVIEW_DATA_DIR:review-data}
    diff:
      max-chars: 200000
      max-files: 80
      single-max-files: 25
      single-max-chars: 80000
      shard-max-files: 20
      shard-max-chars: 60000
    context:
      max-file-chars: 30000
      max-total-chars: 80000
    llm:
      max-rounds: 8
    # 与 dap-agent 共用同一套 LLM_*（不再强制单独 DAP_REVIEW_LLM_*）
    model:
      enabled: ${DAP_REVIEW_LLM_ENABLED:true}
      api-key: ${DAP_REVIEW_LLM_API_KEY:${LLM_API_KEY:${ADA_LLM_API_KEY:}}}
      base-url: ${DAP_REVIEW_LLM_BASE_URL:${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}}
      chat-model: ${DAP_REVIEW_LLM_CHAT_MODEL:${LLM_MODEL:qwen-max}}
    partition:
      module-depth: 2
      parallelism: 4
    knowledge:
      base-url: ${DAP_REVIEW_KNOWLEDGE_BASE_URL:http://127.0.0.1:8010}
    rules:
      java-path: ${DAP_REVIEW_JAVA_RULES:rule/java_review.md}
      frontend-path: ${DAP_REVIEW_FRONTEND_RULES:rule/frontend_review.md}
      mybatis-xml-path: ${DAP_REVIEW_MYBATIS_RULES:rule/mybatis_xml_review.md}
      sql-path: ${DAP_REVIEW_SQL_RULES:rule/sql_review.md}
      config-path: ${DAP_REVIEW_CONFIG_RULES:rule/config_review.md}

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    com.lonple.dap.server: INFO
    com.lonple.dap.server.config.RequestLoggingFilter: INFO
    com.lonple.dap.server.integration.agent: INFO
    com.lonple.dap.server.modules.chat: INFO
